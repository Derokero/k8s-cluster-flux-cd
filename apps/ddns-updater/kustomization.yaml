apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ddns-updater
resources:
  - deployment.yaml
  - service.yaml
  - namespace.yaml
  - network-policy.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/automountServiceAccountToken
        value: false
