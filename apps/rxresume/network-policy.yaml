apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: reactive-resume-policy
  namespace: reactive-resume
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: reactive-resume
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-policy
  namespace: reactive-resume
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: reactive-resume
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
