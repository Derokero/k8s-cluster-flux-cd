apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cluster-wide-zero-trust
spec:
  description: "Minimal cluster-wide base policy"
  endpointSelector: {}

  ingress:
    # Allow local kubelet liveness/readiness health probes & node health checks
    - fromEntities:
        - host
        - remote-node
        - health

    # Allow Hubble Relay & UI to scrape flow metrics from all pods
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hubble-relay
        - matchLabels:
            app.kubernetes.io/name: hubble-ui

    # Allow Cilium agent internal health and metric scraping
    - fromEndpoints:
        - matchLabels:
            k8s-app: cilium

  egress:
    # Scoped L7 DNS resolution exclusively to CoreDNS in kube-system
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"

    # Kubernetes API Server access for cluster control plane communication
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP

    # Base Node, Host & Cilium Agent internal connectivity
    - toEntities:
        - host
        - remote-node
        - health

    - toEndpoints:
        - matchLabels:
            k8s-app: cilium
      toPorts:
        - ports:
            - port: "4242"
              protocol: TCP
            - port: "4244"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-coredns-ingress
spec:
  description: "Allow incoming DNS queries to CoreDNS from workloads in all namespaces"
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-upstream-egress
  namespace: kube-system
spec:
  description: "Allow CoreDNS pods to forward upstream queries to the LAN gateway"
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
    - toCIDR:
        - 10.0.0.138/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-hubble-ui
  namespace: kube-system
spec:
  description: "Allow ingress to Hubble UI"
  endpointSelector:
    matchLabels:
      k8s-app: hubble-ui
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hubble-relay
      toPorts:
        - ports:
            - port: "4245"
              protocol: TCP
            - port: "4244"
              protocol: TCP

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
